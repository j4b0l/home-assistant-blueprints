variables:
  precision: !input precision
  rooms:
    - {e: !input room_1, w: !input weight_1}
    - {e: !input room_2, w: !input weight_2}
    - {e: !input room_3, w: !input weight_3}
    - {e: !input room_4, w: !input weight_4}
    - {e: !input room_5, w: !input weight_5}
    - {e: !input room_6, w: !input weight_6}
    - {e: !input room_7, w: !input weight_7}
    - {e: !input room_8, w: !input weight_8}
    - {e: !input room_9, w: !input weight_9}
    - {e: !input room_10, w: !input weight_10}
    - {e: !input room_11, w: !input weight_11}
    - {e: !input room_12, w: !input weight_12}
    - {e: !input room_13, w: !input weight_13}
    - {e: !input room_14, w: !input weight_14}
    - {e: !input room_15, w: !input weight_15}
    - {e: !input room_16, w: !input weight_16}
    - {e: !input room_17, w: !input weight_17}
    - {e: !input room_18, w: !input weight_18}
    - {e: !input room_19, w: !input weight_19}
    - {e: !input room_20, w: !input weight_20}

sensor:
  unit_of_measurement: !input unit
  device_class: !input device_class
  state_class: measurement
  # Per room: if the sensor OR its weight helper is unavailable/unknown/non-numeric,
  # that room contributes value 0 and weight 0 (i.e. it is excluded). The sensor
  # itself never goes unavailable; with no usable room it reports "unknown".
  state: >
    {%- set ns = namespace(sum=0.0, wsum=0.0) -%}
    {%- for r in rooms if r.e not in [none, ''] -%}
      {%- set v = states(r.e) -%}
      {%- set w = (states(r.w) if (r.w is string and '.' in r.w) else r.w) -%}
      {%- set ok = (v | is_number) and (w | is_number) and (w | float(0)) > 0 -%}
      {%- set val = (v | float(0)) if ok else 0 -%}
      {%- set wt = (w | float(0)) if ok else 0 -%}
      {%- set ns.sum = ns.sum + val * wt -%}
      {%- set ns.wsum = ns.wsum + wt -%}
    {%- endfor -%}
    {{ (ns.sum / ns.wsum) | round(precision | int(1)) if ns.wsum > 0 else none }}
  attributes:
    rooms_counted: >
      {%- set ns = namespace(n=0) -%}
      {%- for r in rooms if r.e not in [none, ''] -%}
        {%- set w = (states(r.w) if (r.w is string and '.' in r.w) else r.w) -%}
        {%- if (states(r.e) | is_number) and (w | is_number) and (w | float(0)) > 0 -%}{%- set ns.n = ns.n + 1 -%}{%- endif -%}
      {%- endfor -%}
      {{ ns.n }}
    total_weight: >
      {%- set ns = namespace(w=0.0) -%}
      {%- for r in rooms if r.e not in [none, ''] -%}
        {%- set w = (states(r.w) if (r.w is string and '.' in r.w) else r.w) -%}
        {%- if (states(r.e) | is_number) and (w | is_number) and (w | float(0)) > 0 -%}{%- set ns.w = ns.w + (w | float) -%}{%- endif -%}
      {%- endfor -%}
      {{ ns.w | round(1) }}
    excluded: >
      {%- set ns = namespace(l=[]) -%}
      {%- for r in rooms if r.e not in [none, ''] -%}
        {%- set w = (states(r.w) if (r.w is string and '.' in r.w) else r.w) -%}
        {%- if not ((states(r.e) | is_number) and (w | is_number) and (w | float(0)) > 0) -%}
          {%- set ns.l = ns.l + [r.e ~ ' (sensor=' ~ states(r.e) ~ ', weight=' ~ w ~ ')'] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.l }}
