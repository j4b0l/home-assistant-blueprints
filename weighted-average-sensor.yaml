blueprint:
  name: Weighted average sensor
  description: |
    One sensor that is the WEIGHTED AVERAGE of up to 20 source sensors - e.g.
    a whole-home temperature (or humidity) where each room counts in
    proportion to its floor area or volume.

    Per room: pick the source sensor and give it a weight (m² or m³) - either
    an input_number helper (e.g. input_number.indoor_area_salon, editable in
    the UI, changes apply live) or a plain number. Empty slots and rooms with
    weight 0 are ignored. Sources that are unavailable,
    unknown or non-numeric are skipped at that moment, so one dead sensor does
    not break the average; the sensor becomes unavailable only when every
    weighted source is gone.

    Result = sum(value × weight) / sum(weight), rounded to "Precision".

    This is a TEMPLATE blueprint: it is used from YAML, not from the Helpers UI.
    Install it under blueprints/template/... and create each sensor with:

      template:
        - use_blueprint:
            path: j4b0l/weighted-average-sensor.yaml
            input:
              unit: "°C"
              device_class: temperature
              room_1: sensor.salon_temperature
              weight_1: input_number.indoor_area_salon
          name: "Dom – temperatura (średnia ważona)"
          unique_id: home_weighted_temperature

    Then reload Template entities (Developer tools -> YAML). Use it twice for
    temperature and humidity - two inputs sets, two outputs.

    Version: 2026-09-13.3
  domain: template

  input:
    output_section:
      name: Output
      icon: mdi:sigma
      input:
        unit:
          name: Unit of measurement
          default: "°C"
          selector:
            select:
              options:
                - "°C"
                - "%"
                - "ppm"
                - "µg/m³"
                - "hPa"
                - "lx"
              custom_value: true
        device_class:
          name: Device class
          default: temperature
          selector:
            select:
              options:
                - temperature
                - humidity
                - carbon_dioxide
                - pm25
                - atmospheric_pressure
                - illuminance
        precision:
          name: Precision (decimal places)
          default: 1
          selector:
            number:
              min: 0
              max: 3
              step: 1
              mode: box

    room_1_section:
      name: Room 1
      icon: mdi:floor-plan
      input:
        room_1:
          name: "Room 1: sensor"
          description: Leave empty to skip this slot.
          default:
          selector:
            entity:
              filter:
                - domain: sensor
        weight_1:
          name: "Room 1: weight"
          description: >
            An input_number helper holding the room's floor area (m²) or volume
            (m³) - e.g. input_number.indoor_area_salon - or a plain number.
            0 excludes the room.
          default: 0
          selector:
            entity:
              filter:
                - domain: input_number

    room_2_section:
      name: Room 2
      icon: mdi:floor-plan
      input:
        room_2:
