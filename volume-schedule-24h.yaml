blueprint:
  name: 24h volume schedule
  description: |
    Set the volume of ONE media player to a chosen level at up to 10 times of
    day. Between those times the automation does NOTHING, so any volume you set
    by hand (or that another automation sets) is left alone until the next
    scheduled time.

    Each slot is a time + a volume level (0-100 %). Slot 1 is pre-filled
    (07:00, 50 %); slots 2-10 are optional - leave the time empty to skip a
    slot. Slots may be in any order.

    At a scheduled time the volume is applied only if the player is available
    (not "unavailable"/"unknown"). If two slots share the same time the later
    slot wins.

    Optional catch-up: when enabled, the most recent slot's volume is applied
    again whenever the player comes back from unavailable/off (e.g. it was
    powered off at the scheduled time). Off by default, because it overrides a
    manual volume set before the player went away.

    Version: 2026-09-11
  domain: automation

  input:
    player_section:
      name: Player
      icon: mdi:speaker
      input:
        player:
          name: Media player
          description: The single media player whose volume is scheduled.
          selector:
            entity:
              filter:
                - domain: media_player
        catch_up:
          name: Catch up when the player comes back
          description: >
            When the player returns from unavailable/off, re-apply the volume of
            the most recent slot that has already passed today (or the last slot
            of yesterday). Leave off to never touch the volume between slots.
          default: false
          selector:
            boolean: {}

    slot_1_section:
      name: Time 1
      icon: mdi:clock-time-one-outline
      input:
        time_1:
          name: "Time 1"
          description: Leave empty to skip this slot.
          default: "07:00:00"
          selector:
            time: {}
        volume_1:
          name: "Volume at time 1 (%)"
          default: 50
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

    slot_2_section:
      name: Time 2 (optional)
      icon: mdi:clock-time-two-outline
      input:
        time_2:
          name: "Time 2"
          description: Leave empty to skip this slot.
          default: 
          selector:
            time: {}
        volume_2:
          name: "Volume at time 2 (%)"
          default: 50
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

    slot_3_section:
      name: Time 3 (optional)
      icon: mdi:clock-time-three-outline
      input:
        time_3:
          name: "Time 3"
          description: Leave empty to skip this slot.
          default: 
          selector:
            time: {}
        volume_3:
          name: "Volume at time 3 (%)"
          default: 50
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

    slot_4_section:
      name: Time 4 (optional)
      icon: mdi:clock-time-four-outline
      collapsed: true
      input:
        time_4:
          name: "Time 4"
          description: Leave empty to skip this slot.
          default: 
          selector:
            time: {}
        volume_4:
          name: "Volume at time 4 (%)"
          default: 50
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

    slot_5_section:
      name: Time 5 (optional)
      icon: mdi:clock-time-five-outline
      collapsed: true
      input:
        time_5:
          name: "Time 5"
          description: Leave empty to skip this slot.
          default: 
          selector:
            time: {}
        volume_5:
          name: "Volume at time 5 (%)"
          default: 50
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

    slot_6_section:
      name: Time 6 (optional)
      icon: mdi:clock-time-six-outline
      collapsed: true
      input:
        time_6:
          name: "Time 6"
          description: Leave empty to skip this slot.
          default: 
          selector:
            time: {}
        volume_6:
          name: "Volume at time 6 (%)"
          default: 50
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

    slot_7_section:
      name: Time 7 (optional)
      icon: mdi:clock-time-seven-outline
      collapsed: true
      input:
        time_7:
          name: "Time 7"
          description: Leave empty to skip this slot.
          default: 
          selector:
            time: {}
        volume_7:
          name: "Volume at time 7 (%)"
          default: 50
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

    slot_8_section:
      name: Time 8 (optional)
      icon: mdi:clock-time-eight-outline
      collapsed: true
      input:
        time_8:
          name: "Time 8"
          description: Leave empty to skip this slot.
          default: 
          selector:
            time: {}
        volume_8:
          name: "Volume at time 8 (%)"
          default: 50
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
