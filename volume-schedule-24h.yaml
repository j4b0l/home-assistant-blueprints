              mode: slider

mode: single
max_exceeded: silent

variables:
  player: !input player
  catch_up: !input catch_up
  t1: !input time_1
  v1: !input volume_1
  t2: !input time_2
  v2: !input volume_2
  t3: !input time_3
  v3: !input volume_3
  t4: !input time_4
  v4: !input volume_4
  t5: !input time_5
  v5: !input volume_5
  t6: !input time_6
  v6: !input volume_6
  t7: !input time_7
  v7: !input volume_7
  t8: !input time_8
  v8: !input volume_8
  t9: !input time_9
  v9: !input volume_9
  t10: !input time_10
  v10: !input volume_10
  # Configured slots: only those with a non-empty time, as [{'t': 'HH:MM', 'v': pct}].
  slots: >-
    {%- set ns = namespace(l=[]) -%}
    {%- for s in [{'t': t1, 'v': v1}, {'t': t2, 'v': v2}, {'t': t3, 'v': v3}, {'t': t4, 'v': v4}, {'t': t5, 'v': v5}, {'t': t6, 'v': v6}, {'t': t7, 'v': v7}, {'t': t8, 'v': v8}, {'t': t9, 'v': v9}, {'t': t10, 'v': v10}] -%}
      {%- if s.t is string and (s.t | length) >= 5 -%}
        {%- set ns.l = ns.l + [{'t': s.t[0:5], 'v': (s.v | float(50)) }] -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.l }}
  now_hm: "{{ now().strftime('%H:%M') }}"
  # Slot due at this minute (last matching wins), or none.
  due_volume: >-
    {%- set ns = namespace(v=none) -%}
    {%- for s in slots if s.t == now_hm -%}{%- set ns.v = s.v -%}{%- endfor -%}
    {{ ns.v }}
  # Volume of the most recent slot already passed today; if none passed yet,
  # the latest slot of the day (i.e. yesterday's last). none if no slots.
  latest_volume: >-
    {%- set ns = namespace(v=none, bt='', lv=none, lt='') -%}
    {%- for s in slots -%}
      {%- if s.t <= now_hm and s.t >= ns.bt -%}{%- set ns.bt = s.t -%}{%- set ns.v = s.v -%}{%- endif -%}
      {%- if s.t >= ns.lt -%}{%- set ns.lt = s.t -%}{%- set ns.lv = s.v -%}{%- endif -%}
    {%- endfor -%}
    {{ ns.v if ns.v is not none else ns.lv }}
  player_ok: "{{ states(player) not in ['unavailable', 'unknown'] }}"

trigger:
  - platform: time_pattern
    minutes: "/1"
    id: tick
  - platform: state
    entity_id: !input player
    from:
      - unavailable
      - unknown
      - "off"
    id: back

condition:
  - "{{ player_ok }}"
  - or:
      - "{{ trigger.id == 'tick' and due_volume is not none }}"
      - "{{ trigger.id == 'back' and catch_up and latest_volume is not none }}"

action:
  - variables:
      target_volume: "{{ due_volume if trigger.id == 'tick' else latest_volume }}"
  - service: media_player.volume_set
    target:
      entity_id: "{{ player }}"
    data:
      volume_level: "{{ ((target_volume | float) / 100) | round(3) }}"
