  cam10_animal: !input cam10_animal
  # Every watched sensor: {e, cam, type}.
  watched: >
    {%- set cams = [
      {'dev': cam1_device, 'name': cam1_name, 'motion': cam1_motion, 'person': cam1_person, 'vehicle': cam1_vehicle, 'animal': cam1_animal},
      {'dev': cam2_device, 'name': cam2_name, 'motion': cam2_motion, 'person': cam2_person, 'vehicle': cam2_vehicle, 'animal': cam2_animal},
      {'dev': cam3_device, 'name': cam3_name, 'motion': cam3_motion, 'person': cam3_person, 'vehicle': cam3_vehicle, 'animal': cam3_animal},
      {'dev': cam4_device, 'name': cam4_name, 'motion': cam4_motion, 'person': cam4_person, 'vehicle': cam4_vehicle, 'animal': cam4_animal},
      {'dev': cam5_device, 'name': cam5_name, 'motion': cam5_motion, 'person': cam5_person, 'vehicle': cam5_vehicle, 'animal': cam5_animal},
      {'dev': cam6_device, 'name': cam6_name, 'motion': cam6_motion, 'person': cam6_person, 'vehicle': cam6_vehicle, 'animal': cam6_animal},
      {'dev': cam7_device, 'name': cam7_name, 'motion': cam7_motion, 'person': cam7_person, 'vehicle': cam7_vehicle, 'animal': cam7_animal},
      {'dev': cam8_device, 'name': cam8_name, 'motion': cam8_motion, 'person': cam8_person, 'vehicle': cam8_vehicle, 'animal': cam8_animal},
      {'dev': cam9_device, 'name': cam9_name, 'motion': cam9_motion, 'person': cam9_person, 'vehicle': cam9_vehicle, 'animal': cam9_animal},
      {'dev': cam10_device, 'name': cam10_name, 'motion': cam10_motion, 'person': cam10_person, 'vehicle': cam10_vehicle, 'animal': cam10_animal}] -%}
      {%- set W = namespace(items=[]) -%}
      {%- for c in cams if c.dev not in [none, ''] -%}
        {%- for e in device_entities(c.dev) if e.startswith('binary_sensor.') -%}
          {%- set t = none -%}
          {%- if c.motion and e.endswith('_motion') -%}{%- set t = 'motion' -%}
          {%- elif c.person and e.endswith('_person') -%}{%- set t = 'person' -%}
          {%- elif c.vehicle and e.endswith('_vehicle') -%}{%- set t = 'vehicle' -%}
          {%- elif c.animal and (e.endswith('_animal') or e.endswith('_pet')) -%}{%- set t = 'animal' -%}{%- endif -%}
          {%- if t is not none -%}{%- set W.items = W.items + [{'e': e, 'cam': c.name, 'type': t}] -%}{%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
    {{ W.items }}

action:
  # 1) first trigger: note what is on now  2) wait the aggregation period
  # 3) collect everything on at any point in the window  4) notify/announce  5) pause
  - variables:
      hits_start: >
        {%- set H = namespace(items=[]) -%}
        {%- for w in watched if states(w.e) == 'on' -%}{%- set H.items = H.items + [w] -%}{%- endfor -%}
        {{ H.items }}
  - delay:
      seconds: "{{ aggregation_seconds | int }}"
  - variables:
      # Everything that was on at ANY point during the window: still on now, or
      # switched off within the window (so it must have been on during it).
      hits_end: >
        {%- set cutoff = as_timestamp(now()) - ((aggregation_seconds | int) + 1) -%}
        {%- set H = namespace(items=[]) -%}
        {%- for w in watched -%}
          {%- set st = states[w.e] -%}
          {%- if st is not none and (st.state == 'on' or (st.state == 'off' and as_timestamp(st.last_changed) >= cutoff)) -%}{%- set H.items = H.items + [w] -%}{%- endif -%}
        {%- endfor -%}
        {{ H.items }}
      hits: "{{ (hits_start + hits_end) | unique(attribute='e') | list }}"
      types: "{{ hits | map(attribute='type') | unique | list }}"
      cam_names: "{{ hits | map(attribute='cam') | reject('eq', '') | unique | list }}"
      type_text: >-
        {%- set specific = [] -%}
        {%- if 'person' in types -%}{%- set specific = specific + [text_person] -%}{%- endif -%}
        {%- if 'vehicle' in types -%}{%- set specific = specific + [text_vehicle] -%}{%- endif -%}
        {%- if 'animal' in types -%}{%- set specific = specific + [text_animal] -%}{%- endif -%}
        {{ (specific | join(', ')) if specific | count > 0 else text_motion }}
  - variables:
      message: "{{ type_text }} at {{ cam_names | join(', ') }}"
  # Send once (skip if nothing was actually detected by the time we look).
  - if:
      - "{{ hits | count > 0 }}"
    then:
      - repeat:
          for_each: !input notify_devices
          sequence:
            - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
              data:
                title: "📷 Motion"
                message: "{{ message }}"
      - repeat:
          for_each: !input announce_targets
          sequence:
            - choose:
                - conditions:
                    - "{{ repeat.item.startswith('assist_satellite.') }}"
                  sequence:
                    - service: assist_satellite.announce
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        message: "{{ message }}"
                - conditions:
                    - "{{ repeat.item.startswith('media_player.') and tts_engine not in [none, ''] }}"
                  sequence:
                    - service: tts.speak
                      target:
                        entity_id: "{{ tts_engine }}"
                      data:
                        media_player_entity_id: "{{ repeat.item }}"
                        message: "{{ message }}"
  # Quiet period: with mode single, detections arriving now are dropped.
  - delay:
      seconds: "{{ pause_seconds | int }}"
