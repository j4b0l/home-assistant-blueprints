blueprint:
  name: Camera motion aggregator
  description: |
    Aggregate motion / person / vehicle / animal detections from up to 10
    cameras into ONE notification and/or announcement per event burst.

    How it works:
      1. Any included detection sensor of any configured camera turns on.
      2. The automation collects everything detected over the aggregation
         period (default 5 s) — all detection types, all cameras.
      3. It sends one push notification and one announcement, then stays quiet
         for the pause period (default 30 s); detections during the pause are
         ignored (not notified, not announced).

    Message: "<types> at <cameras>", e.g. "Person, Vehicle at Driveway, Gate".
      - <types>: if ONLY generic motion was seen -> the generic-motion text.
        If any specific type (person / vehicle / animal) was seen -> those
        texts, generic motion text always skipped, joined by ", ".
      - <cameras>: the configured name of every camera that detected
        something, joined by ", ".

    Camera setup: pick the camera DEVICE and tick which detection types to
    include. The detection sensors are located by entity-id suffix on that
    device — binary_sensor.*_motion, *_person, *_vehicle, *_animal (or *_pet)
    — which matches the Reolink integration's naming. Give each camera a short
    name for the messages. Cameras with no device set are ignored.

    Only one run happens at a time (mode: single); overlapping bursts are
    absorbed into the current aggregation or dropped during the pause.

    Version: 2026-09-11
  domain: automation

  input:
    detection_section:
      name: Detection
      icon: mdi:motion-sensor
      input:
        aggregation_seconds:
          name: Aggregation period (seconds)
          description: Collect all detections for this long after the first one, then send once.
          default: 5
          selector:
            number:
              min: 1
              max: 120
              step: 1
              unit_of_measurement: s
              mode: slider
        pause_seconds:
          name: Pause after notifying (seconds)
          description: Ignore new detections for this long after a notification/announcement.
          default: 30
          selector:
            number:
              min: 0
              max: 3600
              step: 1
              unit_of_measurement: s
              mode: slider

    texts_section:
      name: Message texts
      icon: mdi:message-text
      input:
        text_motion:
          name: Generic motion text
          default: "Motion"
          selector:
            text: {}
        text_person:
          name: Person text
          default: "Person"
          selector:
            text: {}
        text_vehicle:
          name: Vehicle text
          default: "Vehicle"
          selector:
            text: {}
        text_animal:
          name: Animal text
          default: "Animal"
          selector:
            text: {}

    targets_section:
      name: Targets
      icon: mdi:bullhorn
      input:
        notify_devices:
          name: Push-notification devices
          description: Companion-app (mobile) devices that receive the push.
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app
        announce_targets:
          name: Announcement targets
          description: Assist satellites (e.g. Home Assistant Voice) and/or media players.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: assist_satellite
                - domain: media_player
        tts_engine:
          name: TTS engine (for media players)
          description: Used only for media_player targets; Assist satellites announce natively.
          default:
          selector:
            entity:
              filter:
                - domain: tts

    camera_1_section:
      name: Camera 1
      icon: mdi:cctv
      collapsed: true
      input:
        cam1_device:
          name: "Camera 1: device"
          description: The camera device (its detection binary_sensors are found by name suffix).
          default:
          selector:
            device: {}
        cam1_name:
          name: "Camera 1: name in messages"
          default: ""
          selector:
            text: {}
        cam1_motion:
          name: "Camera 1: include generic motion"
          default: true
          selector:
            boolean: {}
        cam1_person:
          name: "Camera 1: include person"
          default: true
          selector:
            boolean: {}
        cam1_vehicle:
          name: "Camera 1: include vehicle"
          default: true
