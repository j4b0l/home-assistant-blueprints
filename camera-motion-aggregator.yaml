trigger:
  # Fires when ANY included detection sensor of any configured camera is on.
  - platform: template
    value_template: >
      {%- set cams = [
        {'dev': cam1_device, 'motion': cam1_motion, 'person': cam1_person, 'vehicle': cam1_vehicle, 'animal': cam1_animal},
        {'dev': cam2_device, 'motion': cam2_motion, 'person': cam2_person, 'vehicle': cam2_vehicle, 'animal': cam2_animal},
        {'dev': cam3_device, 'motion': cam3_motion, 'person': cam3_person, 'vehicle': cam3_vehicle, 'animal': cam3_animal},
        {'dev': cam4_device, 'motion': cam4_motion, 'person': cam4_person, 'vehicle': cam4_vehicle, 'animal': cam4_animal},
        {'dev': cam5_device, 'motion': cam5_motion, 'person': cam5_person, 'vehicle': cam5_vehicle, 'animal': cam5_animal},
        {'dev': cam6_device, 'motion': cam6_motion, 'person': cam6_person, 'vehicle': cam6_vehicle, 'animal': cam6_animal},
        {'dev': cam7_device, 'motion': cam7_motion, 'person': cam7_person, 'vehicle': cam7_vehicle, 'animal': cam7_animal},
        {'dev': cam8_device, 'motion': cam8_motion, 'person': cam8_person, 'vehicle': cam8_vehicle, 'animal': cam8_animal},
        {'dev': cam9_device, 'motion': cam9_motion, 'person': cam9_person, 'vehicle': cam9_vehicle, 'animal': cam9_animal},
        {'dev': cam10_device, 'motion': cam10_motion, 'person': cam10_person, 'vehicle': cam10_vehicle, 'animal': cam10_animal}] -%}
      {%- set W = namespace(items=[]) -%}
      {%- for c in cams if c.dev not in [none, ''] -%}
        {%- for e in device_entities(c.dev) if e.startswith('binary_sensor.') -%}
          {%- set t = none -%}
          {%- if c.motion and e.endswith('_motion') -%}{%- set t = 'motion' -%}
          {%- elif c.person and e.endswith('_person') -%}{%- set t = 'person' -%}
          {%- elif c.vehicle and e.endswith('_vehicle') -%}{%- set t = 'vehicle' -%}
          {%- elif c.animal and (e.endswith('_animal') or e.endswith('_pet')) -%}{%- set t = 'animal' -%}{%- endif -%}
          {%- if t is not none -%}{%- set W.items = W.items + [{'e': e, 'cam': c.name, 'type': t}] -%}{%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ W.items | map(attribute='e') | map('states') | select('eq', 'on') | list | count > 0 }}

