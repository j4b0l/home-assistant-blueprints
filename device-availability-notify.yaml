blueprint:
  name: Device availability notifier
  description: |
    Watch a group of devices and report how many are unavailable — as a push
    notification at 1-4 times of day, and/or as a spoken announcement at its own
    1-4 times of day.

    You configure up to ~20 devices, how long a device must be continuously
    unavailable before it counts (default 30 min), the daily times to send the
    push report, and — separately — the daily times to announce it by voice.

    A device is considered unavailable/unreachable using, in order:
      1. a device-provided connectivity binary_sensor (device_class "connectivity")
         being "off" — the best signal when the device offers it;
      2. any of its entities reporting the literal state "unreachable";
      3. otherwise, ALL of its entities being "unavailable"/"unknown".
    The "continuously for X" timer uses that signal's last state change, so a
    device that flaps back for even a moment restarts its timer.

    Each message states the NUMBER of unavailable devices, in English (push
    "2 devices unavailable", spoken "Attention. 2 devices unavailable."), with
    your optional custom text appended. Nothing is sent at a scheduled time when
    no device is currently past its threshold.

    Times: slot 1 of each schedule is pre-filled (09:00); slots 2-4 are optional
    — leave them empty to use fewer times. Notify and announce schedules are
    independent; a time present in both fires both.

    Version: 2026-09-11
  domain: automation

  input:
    devices_section:
      name: Devices
      icon: mdi:devices
      input:
        devices:
          name: Devices to watch (up to 20)
          default: []
          selector:
            device:
              multiple: true
        threshold:
          name: Unavailable continuously for at least
          description: A device is only counted after it has been down this long without interruption.
          default:
            minutes: 30
          selector:
            duration: {}

    notify_schedule_section:
      name: Push notification times (1-4 per day)
      icon: mdi:cellphone-message
      input:
        notify_time_1:
          name: Notify time 1
          default: "09:00:00"
          selector:
            time: {}
        notify_time_2:
          name: Notify time 2 (optional)
          default:
          selector:
            time: {}
        notify_time_3:
          name: Notify time 3 (optional)
          default:
          selector:
            time: {}
        notify_time_4:
          name: Notify time 4 (optional)
          default:
          selector:
            time: {}

    announce_schedule_section:
      name: Voice announcement times (1-4 per day)
      icon: mdi:bullhorn-outline
      input:
        announce_time_1:
          name: Announce time 1
          default: "09:00:00"
          selector:
            time: {}
        announce_time_2:
          name: Announce time 2 (optional)
          default:
          selector:
            time: {}
        announce_time_3:
          name: Announce time 3 (optional)
          default:
          selector:
            time: {}
        announce_time_4:
          name: Announce time 4 (optional)
          default:
          selector:
            time: {}

    message_section:
      name: Message
      icon: mdi:message-text
      input:
        custom_text:
          name: Custom text (optional)
          description: Appended to the end of every notification and announcement.
          default: ""
          selector:
            text: {}

    targets_section:
      name: Targets
      icon: mdi:bullhorn
      input:
        notify_devices:
          name: Push-notification devices
          description: Companion-app (mobile) devices that receive the push.
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app
        announce_targets:
          name: Voice announcement targets
          description: Assist satellites (e.g. Home Assistant Voice) that speak the report.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: assist_satellite

mode: single
max_exceeded: silent

variables:
  devices: !input devices
  thr: !input threshold
  custom_text: !input custom_text
  nt1: !input notify_time_1
  nt2: !input notify_time_2
  nt3: !input notify_time_3
  nt4: !input notify_time_4
  at1: !input announce_time_1
  at2: !input announce_time_2
  at3: !input announce_time_3
  at4: !input announce_time_4
  thr_secs: "{{ (thr.days|default(0))*86400 + (thr.hours|default(0))*3600 + (thr.minutes|default(0))*60 + (thr.seconds|default(0)) }}"
  # Is the current HH:MM one of the configured (non-empty) times?
  notify_due: >
    {%- set ns = namespace(l=[]) -%}
    {%- for t in [nt1, nt2, nt3, nt4] -%}
      {%- if t is string and (t | length) >= 5 -%}{%- set ns.l = ns.l + [t[0:5]] -%}{%- endif -%}
    {%- endfor -%}
    {{ now().strftime('%H:%M') in ns.l }}
  announce_due: >
    {%- set ns = namespace(l=[]) -%}
    {%- for t in [at1, at2, at3, at4] -%}
      {%- if t is string and (t | length) >= 5 -%}{%- set ns.l = ns.l + [t[0:5]] -%}{%- endif -%}
    {%- endfor -%}
    {{ now().strftime('%H:%M') in ns.l }}
  # Count of devices past their threshold, computed only when something is due
  # (so the device scan is skipped on other minutes).
  report: >
    {%- macro down1(dev, thr) -%}
      {%- set ents = device_entities(dev) -%}
      {%- set ns = namespace(conn=none, unreach=none, allun=true, has=false, maxlc=0, down=false, since=0) -%}
      {%- for e in ents -%}
        {%- set s = states[e] -%}
        {%- if s is not none -%}
          {%- set ns.has = true -%}
          {%- if e.startswith('binary_sensor.') and state_attr(e, 'device_class') == 'connectivity' and ns.conn is none -%}{%- set ns.conn = s -%}{%- endif -%}
          {%- if (s.state | lower) == 'unreachable' and ns.unreach is none -%}{%- set ns.unreach = s -%}{%- endif -%}
          {%- if s.state not in ['unavailable', 'unknown', 'none'] -%}{%- set ns.allun = false -%}{%- endif -%}
          {%- set lc = as_timestamp(s.last_changed) -%}
          {%- if lc > ns.maxlc -%}{%- set ns.maxlc = lc -%}{%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if ns.conn is not none -%}{%- set ns.down = (ns.conn.state == 'off') -%}{%- set ns.since = as_timestamp(ns.conn.last_changed) -%}
      {%- elif ns.unreach is not none -%}{%- set ns.down = true -%}{%- set ns.since = as_timestamp(ns.unreach.last_changed) -%}
      {%- elif ns.has and ns.allun -%}{%- set ns.down = true -%}{%- set ns.since = ns.maxlc -%}{%- endif -%}
      {{- 1 if (ns.down and (as_timestamp(now()) - ns.since) >= (thr | int)) else 0 -}}
    {%- endmacro -%}
    {%- if notify_due or announce_due -%}
      {%- set g = namespace(c=0) -%}
      {%- for d in devices -%}{%- set g.c = g.c + (down1(d, thr_secs) | int) -%}{%- endfor -%}
      {{- g.c -}}
    {%- else -%}{{- 0 -}}{%- endif -%}

trigger:
  - platform: time_pattern
    minutes: "/1"

condition:
  - "{{ (notify_due or announce_due) and (report | int) > 0 }}"

action:
  - variables:
      push_msg: >-
        {{ report | int }} device{{ 's' if (report | int) != 1 else '' }} unavailable{{ '\n' ~ custom_text if custom_text | trim else '' }}
      speak_msg: >-
        Attention. {{ report | int }} device{{ 's' if (report | int) != 1 else '' }} unavailable.{{ ' ' ~ custom_text if custom_text | trim else '' }}
  - if:
      - "{{ notify_due }}"
    then:
      - repeat:
          for_each: !input notify_devices
          sequence:
            - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
              data:
                title: "⚠️ Device availability"
                message: "{{ push_msg }}"
  - if:
      - "{{ announce_due }}"
    then:
      - repeat:
          for_each: !input announce_targets
          sequence:
            - service: assist_satellite.announce
              target:
                entity_id: "{{ repeat.item }}"
              data:
                message: "{{ speak_msg }}"
