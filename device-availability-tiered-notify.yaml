blueprint:
  name: Tiered device-availability notifier
  description: |
    Watch three tiers of devices — Critical, Important, Regular — and report how
    many are unavailable, on a per-tier schedule, to your phones and/or voice
    satellites.

    For each tier you configure:
      - up to ~10 devices,
      - how long a device must be continuously unavailable before it counts
        (defaults: Critical 30 min, Important 2 h, Regular 4 h),
      - a cron-like schedule for WHEN to send that tier's report.

    A device is considered unavailable/unreachable using, in order:
      1. a device-provided connectivity binary_sensor (device_class "connectivity")
         being "off" — the best signal when the device offers it;
      2. any of its entities reporting the literal state "unreachable";
      3. otherwise, ALL of its entities being "unavailable"/"unknown".
    The "continuously for X" timer uses that signal's last state change, so a
    device that flaps back for even a moment restarts its timer.

    Each message states only the NUMBER of unavailable devices in that tier, in
    English (e.g. push "2 critical devices unavailable", spoken "Attention. 2
    critical devices unavailable."). A tier is reported only when its schedule
    fires AND it currently has at least one device past its threshold.

    Targets are global (shared by all tiers): any number of companion-app devices
    for push notifications and any number of Assist satellites (e.g. Home
    Assistant Voice) for spoken announcements.

    Cron format: 5 fields "minute hour day-of-month month day-of-week". Each field
    supports "*", a number, a list "a,b", a range "a-b", and steps "*/n" or
    "a-b/n". Sunday = 0. When both day-of-month and day-of-week are set they must
    both match (logical AND).

    Version: 2026-09-09
  domain: automation

  input:
    critical_section:
      name: Critical tier
      icon: mdi:alert-octagon
      input:
        critical_devices:
          name: Critical devices (up to 10)
          default: []
          selector:
            device:
              multiple: true
        critical_threshold:
          name: Unavailable continuously for at least
          default:
            minutes: 30
          selector:
            duration: {}
        critical_cron:
          name: Notify schedule (cron)
          description: 5-field cron for when to send the Critical report.
          default: "*/30 * * * *"
          selector:
            text: {}

    important_section:
      name: Important tier
      icon: mdi:alert
      input:
        important_devices:
          name: Important devices (up to 10)
          default: []
          selector:
            device:
              multiple: true
        important_threshold:
          name: Unavailable continuously for at least
          default:
            hours: 2
          selector:
            duration: {}
        important_cron:
          name: Notify schedule (cron)
          description: 5-field cron for when to send the Important report.
          default: "0 * * * *"
          selector:
            text: {}

    regular_section:
      name: Regular tier
      icon: mdi:information
      input:
        regular_devices:
          name: Regular devices (up to 10)
          default: []
          selector:
            device:
              multiple: true
        regular_threshold:
          name: Unavailable continuously for at least
          default:
            hours: 4
          selector:
            duration: {}
        regular_cron:
          name: Notify schedule (cron)
          description: 5-field cron for when to send the Regular report.
          default: "0 */4 * * *"
          selector:
            text: {}

    targets_section:
      name: Targets (global)
      icon: mdi:bullhorn
      input:
        notify_devices:
          name: Push-notification devices
          description: Companion-app (mobile) devices that receive the push.
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app
        announce_targets:
          name: Voice announcement targets
          description: Assist satellites (e.g. Home Assistant Voice) that speak the report.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: assist_satellite

mode: single
max_exceeded: silent

variables:
  crit_devices: !input critical_devices
  crit_thr: !input critical_threshold
  crit_cron: !input critical_cron
  imp_devices: !input important_devices
  imp_thr: !input important_threshold
  imp_cron: !input important_cron
  reg_devices: !input regular_devices
  reg_thr: !input regular_threshold
  reg_cron: !input regular_cron
  crit_secs: "{{ (crit_thr.days|default(0))*86400 + (crit_thr.hours|default(0))*3600 + (crit_thr.minutes|default(0))*60 + (crit_thr.seconds|default(0)) }}"
  imp_secs: "{{ (imp_thr.days|default(0))*86400 + (imp_thr.hours|default(0))*3600 + (imp_thr.minutes|default(0))*60 + (imp_thr.seconds|default(0)) }}"
  reg_secs: "{{ (reg_thr.days|default(0))*86400 + (reg_thr.hours|default(0))*3600 + (reg_thr.minutes|default(0))*60 + (reg_thr.seconds|default(0)) }}"
  # Which tiers are due now (cron match) AND have >0 devices past their threshold.
  report: >
    {%- macro cfield(field, val, lo, hi) -%}
      {%- set ns = namespace(m=false) -%}
      {%- for raw in field.split(',') -%}
        {%- set step = (raw.split('/')[1] | int) if '/' in raw else 1 -%}
        {%- set p = raw.split('/')[0] -%}
        {%- if p == '*' -%}{%- set a = lo -%}{%- set b = hi -%}
        {%- elif '-' in p -%}{%- set a = p.split('-')[0] | int -%}{%- set b = p.split('-')[1] | int -%}
        {%- else -%}{%- set a = p | int -%}{%- set b = p | int -%}{%- endif -%}
        {%- if step > 0 and val >= a and val <= b and ((val - a) % step) == 0 -%}{%- set ns.m = true -%}{%- endif -%}
      {%- endfor -%}
      {{- 1 if ns.m else 0 -}}
    {%- endmacro -%}
    {%- macro cron_match(cron) -%}
      {%- set f = cron.split() -%}
      {%- if (f | length) != 5 -%}{{- 0 -}}
      {%- else -%}
        {%- set dow = now().isoweekday() % 7 -%}
        {{- (cfield(f[0], now().minute, 0, 59)|int) * (cfield(f[1], now().hour, 0, 23)|int) * (cfield(f[2], now().day, 1, 31)|int) * (cfield(f[3], now().month, 1, 12)|int) * (cfield(f[4], dow, 0, 6)|int) -}}
      {%- endif -%}
    {%- endmacro -%}
    {%- macro down1(dev, thr) -%}
      {%- set ents = device_entities(dev) -%}
      {%- set ns = namespace(conn=none, unreach=none, allun=true, has=false, maxlc=0, down=false, since=0) -%}
      {%- for e in ents -%}
        {%- set s = states[e] -%}
        {%- if s is not none -%}
          {%- set ns.has = true -%}
          {%- if e.startswith('binary_sensor.') and state_attr(e, 'device_class') == 'connectivity' and ns.conn is none -%}{%- set ns.conn = s -%}{%- endif -%}
          {%- if (s.state | lower) == 'unreachable' and ns.unreach is none -%}{%- set ns.unreach = s -%}{%- endif -%}
          {%- if s.state not in ['unavailable', 'unknown', 'none'] -%}{%- set ns.allun = false -%}{%- endif -%}
          {%- set lc = as_timestamp(s.last_changed) -%}
          {%- if lc > ns.maxlc -%}{%- set ns.maxlc = lc -%}{%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if ns.conn is not none -%}{%- set ns.down = (ns.conn.state == 'off') -%}{%- set ns.since = as_timestamp(ns.conn.last_changed) -%}
      {%- elif ns.unreach is not none -%}{%- set ns.down = true -%}{%- set ns.since = as_timestamp(ns.unreach.last_changed) -%}
      {%- elif ns.has and ns.allun -%}{%- set ns.down = true -%}{%- set ns.since = ns.maxlc -%}{%- endif -%}
      {{- 1 if (ns.down and (as_timestamp(now()) - ns.since) >= (thr | int)) else 0 -}}
    {%- endmacro -%}
    {%- set groups = [
      {'label': 'Critical', 'devices': crit_devices, 'thr': crit_secs, 'cron': crit_cron},
      {'label': 'Important', 'devices': imp_devices, 'thr': imp_secs, 'cron': imp_cron},
      {'label': 'Regular', 'devices': reg_devices, 'thr': reg_secs, 'cron': reg_cron}] -%}
    {%- set out = namespace(items=[]) -%}
    {%- for g in groups -%}
      {%- if (cron_match(g.cron) | int) == 1 -%}
        {%- set gg = namespace(c=0) -%}
        {%- for d in g.devices -%}{%- set gg.c = gg.c + (down1(d, g.thr) | int) -%}{%- endfor -%}
        {%- if gg.c > 0 -%}{%- set out.items = out.items + [{'label': g.label, 'count': gg.c}] -%}{%- endif -%}
      {%- endif -%}
    {%- endfor -%}
    {{ out.items }}

trigger:
  - platform: time_pattern
    minutes: "/1"

condition:
  - "{{ report | count > 0 }}"

action:
  - repeat:
      for_each: "{{ report }}"
      sequence:
        - variables:
            label: "{{ repeat.item.label }}"
            count: "{{ repeat.item.count | int }}"
            plural: "{{ 's' if (repeat.item.count | int) != 1 else '' }}"
        - variables:
            message: "{{ count }} {{ label | lower }} device{{ plural }} unavailable"
            speak: "Attention. {{ count }} {{ label | lower }} device{{ plural }} unavailable."
        - repeat:
            for_each: !input notify_devices
            sequence:
              - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                data:
                  title: "⚠️ Device availability"
                  message: "{{ message }}"
        - repeat:
            for_each: !input announce_targets
            sequence:
              - service: assist_satellite.announce
                target:
                  entity_id: "{{ repeat.item }}"
                data:
                  message: "{{ speak }}"
